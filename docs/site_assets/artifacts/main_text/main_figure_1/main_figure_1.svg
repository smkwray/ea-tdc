<text x="36" y="534.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Scale: coefficients are $B responses per +$100B TDC.</text>
<text x="36" y="548.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Run/specification: regression_mmf_rrp_bank_long_selected_credit_rate_lags. This paper-facing branch adds selected</text>
<text x="36" y="562.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">lagged credit and Treasury-rate controls before the K=100 factor tail.</text>
<text x="36" y="576.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Claim boundary: deposit pass-through is the headline; broad mortgage/core-loan crowding-out is weak after selected</text>
<text x="36" y="590.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">lags.</text>
