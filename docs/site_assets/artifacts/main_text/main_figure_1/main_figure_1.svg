<text x="36" y="478.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Treasury-yield lag 1, 10Y Treasury-yield lag 2, Dflmx K100 F1, Dflmx K100 F2, Dflmx K100 F3, Dflmx K100 F4</text>
