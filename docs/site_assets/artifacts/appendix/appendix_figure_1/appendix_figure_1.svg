<text x="36" y="506.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Observations: 85 to 93</text>
<text x="36" y="520.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Scale: coefficients are responses of quarterly outcomes to the GDP-scaled TDC flow.</text>
