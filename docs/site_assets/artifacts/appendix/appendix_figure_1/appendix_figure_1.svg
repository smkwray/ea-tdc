<text x="36" y="548.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Relabeled legacy surface: baseline_tdc_lp_deposits with the K=200 screened branch. This is preserved as</text>
<text x="36" y="562.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">appendix/sensitivity output and is no longer the paper-facing main surface.</text>
<text x="36" y="576.00" font-size="11" font-family="Helvetica, Arial, sans-serif" fill="#555">Sample endpoint note: 2026Q2 is the latest labeled quarter as of 2026-06-10 and may reflect an in-progress quarter</text>
