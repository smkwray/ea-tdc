[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tdc"
version = "0.1.0"
description = "Quarterly Treasury deposit and reserve projections with accounting and stability diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ea-tdc = "ea_tdc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

# Release lint checks Python correctness; formatting is not a release gate.
[tool.ruff.lint]
select = ["E9", "F"]

# Preserve exact source bytes used by the retained factor-production evidence.
# These unused names have no effect on the numerical calculation.
[tool.ruff.lint.per-file-ignores]
"src/ea_tdc/robustness.py" = ["F841"]
"scripts/run_submission_appendix_diagnostics.py" = ["F401"]
